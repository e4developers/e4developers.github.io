<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
/* One download link for posts, shares and QR codes: /get?c=CODE.
   Android goes to Google Play with CODE as the install source, iPhone to the
   App Store (to the landing page until the iPhone app is out), desktop to the
   landing page's QR code. CODE is letters, digits, _ and - only. */
(function () {
  var IOS_LIVE = true;    // the App Store released DrawWatch
  var m = /[?&]c=([A-Za-z0-9_-]{1,40})/.exec(location.search);
  var c = m ? m[1] : "get";
  var u = navigator.userAgent || "";
  var play = "https://play.google.com/store/apps/details?id=com.numcheck.app&referrer=" +
    encodeURIComponent("utm_source=" + c + "&utm_medium=get");
  var dest;
  if (/Android/i.test(u)) dest = play;
  else if (/iPhone|iPad|iPod/i.test(u) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) {
    dest = IOS_LIVE ? "https://apps.apple.com/us/app/id6760988938?ct=" + c : "drawwatch.html?c=" + c;
  } else dest = "drawwatch.html?c=" + c;
  location.replace(dest);
})();
</script>
